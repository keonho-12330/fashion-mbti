<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>O.F.F. Inter-View — 나의 패션 유형 찾기</title>
<meta property="og:title" content="O.F.F. Inter-View">
<meta property="og:description" content="12개의 질문으로 알아보는 나의 패션 유형과 어울리는 브랜드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --ink:#1d1d1f;
  --black:#000;
  --paper:#ffffff;
  --line:#d2d2d7;
  --muted:#86868b;
  --fill:#f5f5f7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter','Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'SF Pro KR','SF Pro Display',sans-serif;
  font-weight:400;
  line-height:1.6;
  letter-spacing:-0.012em;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 24px}
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex;animation:fadein .5s cubic-bezier(.25,.1,.25,1)}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
header{
  padding:18px 0 14px;
  border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
header .logo svg{height:30px;width:auto;display:block}
header .sub{font-size:10px;font-weight:600;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}

/* ---------- intro ---------- */
#intro{justify-content:space-between;padding-bottom:36px}
.intro-top{padding-top:10vh}
.intro-logo svg{height:44px;width:auto;display:block;margin-bottom:36px}
.kicker{font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:16px}
.intro-title{font-size:40px;font-weight:800;line-height:1.18;letter-spacing:-0.025em;margin-bottom:20px}
.intro-desc{font-size:15px;color:var(--muted);font-weight:400;margin-bottom:8px}
.intro-meta{margin-top:36px;border-top:1px solid var(--line);padding-top:18px;display:flex;gap:36px}
.intro-meta div{font-size:11px;font-weight:500;letter-spacing:.04em;color:var(--muted)}
.intro-meta strong{display:block;font-size:22px;color:var(--ink);font-weight:700;letter-spacing:-0.02em}
.btn{
  display:block;width:100%;
  background:var(--black);color:#fff;
  border:none;cursor:pointer;
  font-family:inherit;
  font-size:15px;font-weight:600;letter-spacing:0;
  padding:16px 0;text-align:center;
  border-radius:980px;
  transition:transform .15s ease,opacity .2s;
}
.btn:active{transform:scale(.98);opacity:.85}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}

/* ---------- quiz ---------- */
#quiz{padding-bottom:36px}
.progress-track{height:2px;background:var(--fill);margin-top:0;border-radius:2px}
.progress-bar{height:100%;background:var(--black);width:0%;transition:width .4s cubic-bezier(.25,.1,.25,1);border-radius:2px}
.qnum{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--muted);padding:30px 0 10px}
.qnum b{color:var(--ink);font-size:14px}
.qtext{font-size:23px;font-weight:700;line-height:1.35;letter-spacing:-0.02em;min-height:92px;margin-bottom:24px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  border:1px solid var(--line);background:#fff;
  text-align:left;padding:15px 16px;cursor:pointer;
  font-family:inherit;font-size:14.5px;font-weight:450;line-height:1.5;color:var(--ink);
  display:flex;gap:12px;align-items:flex-start;
  border-radius:14px;
  transition:border-color .15s,background .15s,transform .12s;
}
.opt .mark{font-size:12px;font-weight:700;color:var(--muted);padding-top:2.5px;letter-spacing:.02em}
.opt:active{border-color:var(--black);background:var(--fill);transform:scale(.99)}
.backlink{margin-top:auto;padding-top:22px;background:none;border:none;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;text-align:left;font-family:inherit}

/* ---------- result ---------- */
#result{padding-bottom:44px}
.r-card{border:1px solid var(--line);background:#fff;padding:34px 26px 28px;margin-top:26px;position:relative;border-radius:18px}
.r-card .corner{position:absolute;top:14px;right:18px;font-size:9px;font-weight:600;letter-spacing:.18em;color:var(--muted)}
.r-head{display:flex;gap:16px;align-items:center}
.r-head-text{flex:1 1 auto;min-width:0}
.r-head-text .r-tag{margin-bottom:0}
.r-sketch{flex:0 0 40%;max-width:40%}
.r-sketch img{width:100%;height:auto;object-fit:contain;display:block}
@media (max-width:440px){
  .r-head{gap:12px}
  .r-code{font-size:44px}
}
@media (max-width:360px){
  .r-code{font-size:36px}
}
.r-kicker{font-size:10px;font-weight:600;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.r-code{font-weight:800;font-size:56px;letter-spacing:-0.02em;line-height:1;margin-bottom:10px}
.r-name{font-weight:700;font-size:22px;letter-spacing:-0.02em;margin-bottom:4px}
.r-tag{font-size:13.5px;color:var(--muted);font-weight:450;margin-bottom:22px}
.r-desc{font-size:14px;font-weight:400;color:#3a3a3c;border-top:1px solid var(--line);padding-top:20px}
.axes{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.axis .labels{display:flex;justify-content:space-between;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:6px}
.axis .labels .on{color:var(--ink);font-weight:700}
.axis .track{height:4px;background:var(--fill);position:relative;border-radius:4px;overflow:hidden}
.axis .fill{position:absolute;top:0;height:100%;background:var(--black);border-radius:4px}
.sec-title{font-weight:700;font-size:17px;letter-spacing:-0.02em;margin:44px 0 4px;display:flex;align-items:baseline;gap:10px}
.sec-title span{font-size:9px;font-weight:600;letter-spacing:.2em;color:var(--muted)}
.sec-sub{font-size:12.5px;color:var(--muted);font-weight:400;margin-bottom:16px}
.trait{
  border-bottom:1px solid var(--fill);
  padding:12px 2px;display:flex;gap:12px;align-items:flex-start;
  font-size:13.5px;font-weight:400;color:#3a3a3c;line-height:1.55;
}
.trait:first-of-type{border-top:1px solid var(--fill)}
.trait .check{color:var(--ink);font-size:12px;font-weight:700;padding-top:2px;min-width:14px}
.brand{border-bottom:1px solid var(--fill);padding:16px 2px;display:flex;gap:16px;align-items:baseline}
.brand:first-of-type{border-top:1px solid var(--fill)}
.brand .no{font-size:12px;font-weight:600;color:var(--muted);min-width:22px}
.brand .bname{font-weight:700;font-size:15px;letter-spacing:-0.01em}
.brand .breason{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.tip{background:var(--fill);padding:18px;font-size:13px;font-weight:400;color:#3a3a3c;margin-top:8px;border-radius:14px}
.tip b{font-weight:700;font-size:10px;letter-spacing:.18em;display:block;margin-bottom:6px;color:var(--ink)}
.r-actions{margin-top:40px;display:flex;flex-direction:column;gap:12px}
footer{padding:26px 0 32px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.toast{
  position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);
  background:var(--black);color:#fff;font-size:12.5px;font-weight:500;
  padding:11px 24px;border-radius:980px;opacity:0;pointer-events:none;transition:all .3s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- language select ---------- */
#lang{flex:1;justify-content:center;align-items:center;text-align:center;padding:6vh 0 10vh}
#lang .iv-logo{width:88%;max-width:420px;margin:0 auto 54px;display:block}
#lang .lang-cap{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:22px;line-height:1.9}
.lang-grid{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;margin:0 auto}
.lang-btn{width:100%;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:980px;padding:15px 0;font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.01em;cursor:pointer;transition:transform .15s ease,background .2s,color .2s}
.lang-btn:active{transform:scale(.98);background:var(--black);color:#fff}
header.hidden{display:none}
</style>
</head>

: 1}, {"t": "Cute, but I just save the photo", "s": "C", "w": 0.6}, {"t": "I mull it over, then end up searching for it", "s": "T", "w": 0.6}, {"t": "Straight to cart before it sells out", "s": "T", "w": 1}]}, {"axis": 1, "q": "The style you admire?", "opts": [{"t": "Timeless classic icons that never change", "s": "C", "w": 1}, {"t": "People who make classics their own", "s": "C", "w": 0.6}, {"t": "Those who wear trends with taste", "s": "T", "w": 0.6}, {"t": "The buzziest celeb, ahead of the curve", "s": "T", "w": 1}]}, {"axis": 2, "q": "Your weekend outing outfit?", "opts": [{"t": "Shirt, slacks, proper shoes — fully dressed", "s": "F", "w": 1}, {"t": "A neat knit or jacket for a touch of polish", "s": "F", "w": 0.6}, {"t": "Clean tee and denim, kept light", "s": "R", "w": 0.6}, {"t": "Hoodie and joggers — comfort first", "s": "R", "w": 1}]}, {"axis": 2, "q": "The silhouette you're drawn to?", "opts": [{"t": "Tailored fit that follows the body's line", "s": "F", "w": 1}, {"t": "Structured shoulders, but easy overall", "s": "F", "w": 0.6}, {"t": "A relaxed semi-oversized shape", "s": "R", "w": 0.6}, {"t": "Roomy oversized, flowing naturally", "s": "R", "w": 1}]}, {"axis": 2, "q": "What you reach for most in your shoe rack?", "opts": [{"t": "Loafers, boots, heels — dressed shoes", "s": "F", "w": 1}, {"t": "Clean leather sneakers", "s": "F", "w": 0.6}, {"t": "Everyday canvas sneakers", "s": "R", "w": 0.6}, {"t": "Runners, sandals, slides — comfort only", "s": "R", "w": 1}]}, {"axis": 3, "q": "The colors that rule your closet?", "opts": [{"t": "Black, white, gray — nothing but neutrals", "s": "N", "w": 1}, {"t": "Calm tones like beige and navy", "s": "N", "w": 0.6}, {"t": "Basics mixed with pastels and accent colors", "s": "V", "w": 0.6}, {"t": "Red, green, yellow — full of vivid color", "s": "V", "w": 1}]}, {"axis": 3, "q": "Same design, your pick?", "opts": [{"t": "Neutral, no hesitation", "s": "N", "w": 1}, {"t": "A safe color if possible — no misses", "s": "N", "w": 0.6}, {"t": "I go back and forth, then reach for color", "s": "V", "w": 0.6}, {"t": "The one that grabs attention, always", "s": "V", "w": 1}]}, {"axis": 3, "q": "Your thoughts on patterns?", "opts": [{"t": "If it's not solid, I don't buy it", "s": "N", "w": 1}, {"t": "A subtle stripe at most is fine", "s": "N", "w": 0.6}, {"t": "I love wearing checks, florals and more", "s": "V", "w": 0.6}, {"t": "Bold graphics and mixed prints all welcome", "s": "V", "w": 1}]}], "types": {"MCFN": {"name": "Timeless Minimalist", "tag": "The more you strip away, the more complete you become", "desc": "You trust clean silhouettes and the power of good materials, stripped of excess. You value refinement over trends; your wardrobe is small, yet no combination ever misses. Your style isn't loud — which is exactly why it lingers longer.", "traits": ["You check the fabric label before buying", "You buy two of the same tee in the same color", "One pill and you stop reaching for it", "You rarely shop, but spend big when you do", "Your closet looks empty, yet every outfit comes together", "You buy trend pieces but keep rotating the basics", "You quietly get asked “where's that from?” a lot"], "brands": [["The Row", "The peak of refined silhouette and material devotion"], ["Jil Sander", "A textbook of minimalism"], ["COS", "Architectural minimal for everyday"]], "tip": "White shirt, wool coat, minimal loafers — the more you invest in the basics, the more like yourself you become."}, "MCFV": {"name": "Chic Modernist", "tag": "A restrained look with one shot of color", "desc": "You keep the whole look subdued, but make sure one spot always holds the eye. Your balance of restraint and boldness is so sharp that people keep calling you well-dressed.", "traits": ["Your clothes are neutral, but your bag or shoes bring the color", "You spend twice as long choosing the accent piece as the outfit", "You count lip and nails as part of the styling", "One color and people say you “dressed up” today", "Your accessory tray is beautifully organized", "You wear colors others don't dare to", "A full-length mirror selfie comes out like an editorial"], "brands": [["Loewe", "Quiet luxury with a witty sense of color"], ["Ferragamo", "Modern color laid over the classic"], ["KUHO", "Korean minimalism with a refined color sense"]], "tip": "An all-neutral look with one color bag or shoe — your formula is already complete."}, "MCRN": {"name": "Essentialist", "tag": "A master of the basics", "desc": "A good tee, well-draped trousers, comfortable sneakers. Your taste shows in the un-done. You're living proof that comfort and style can coexist.", "traits": ["You dress similarly every day, yet somehow it looks right", "You own five gray tees and swear they're all different (they are)", "You wait for a discontinued basic to restock, not the new drop", "You have your own rules for folding clothes", "“Looks comfy” is the highest compliment", "‘Black trousers’ lives permanently on your shopping list", "Only you can tell your dressed-up days from your dressed-down ones"], "brands": [["Lemaire", "Effortless grace, the dignity of daily wear"], ["Auralee", "Quiet basics that speak through material"], ["Uniqlo U", "The gold standard of essentials, within everyone's reach"]], "tip": "Even with the same basics, a hair's difference in material and fit completes your look."}, "MCRV": {"name": "Preppy Clean", "tag": "Neat, yet full of life", "desc": "You add bright energy to a clean silhouette. Campus looks, cardigans and fresh color accents suit you, and people find your style easy to like anywhere.", "traits": ["You own shirt-and-knit combos for every season", "A bright-colored outfit lifts your mood too", "Draping a cardigan over your shoulders feels totally natural", "You have a knack for keeping white shoes like new", "You secretly enjoy being called ‘neat’", "It's a style your parents love — and so do you", "You always come out looking bright in photos"], "brands": [["Lacoste", "The originator of sporty classic"], ["Beanpole", "The standard of neat preppy mood"], ["Polo Ralph Lauren", "The bright face of American classic"]], "tip": "A navy-and-ivory base with a green or red accent — freshness is your weapon."}, "MTFN": {"name": "Urban Architect", "tag": "The finish of a city line", "desc": "You wear the city's mood in structured silhouettes and restrained color. You know trends but never get swept up, taking them at your own angle. Your look has a blueprint.", "traits": ["If the shoulder line is off, you can't buy it", "You own three black jackets, each a different silhouette", "You know the trends but wait a season before buying", "Hemming trousers is a mandatory step", "Even your hangers match", "People often ask “heading somewhere nice?”", "Minimal, yet with a detail that's unmistakably different"], "brands": [["Juun.J", "Avant tailoring in structured silhouettes"], ["LOW CLASSIC", "Restrained lines, Seoul contemporary"], ["Andersson Bell", "A mix of Nordic feel and Seoul mood"]], "tip": "One jacket with a good shoulder line explains you better than ten other pieces."}, "MTFV": {"name": "Gallery Muse", "tag": "A look that belongs in a museum", "desc": "On a minimal base you layer artistic color and form. You treat clothes like objets, and often catch the eye before the artwork does at an exhibition.", "traits": ["You've thought of a piece as ‘wearable sculpture’", "You have to try on any unusual silhouette you see", "You dress up most for gallery visits", "You choose even small props by the standard of an objet", "You pull off clothes others ask “how do you wear that?”", "You have your own theory of color combinations", "You truly believe fashion is a form of art"], "brands": [["Jacquemus", "Color sense between minimal and play"], ["Courrèges", "Futuristic lines, a vivid mood"], ["RECTO", "Contemporary mood in restrained silhouettes"]], "tip": "One dress or top with a playful form turns the whole look into a work of art."}, "MTRN": {"name": "Quiet Street", "tag": "The essence of easy cool", "desc": "Relaxed silhouettes, low saturation, but details only the initiated notice. You sit at the center of trends without making a sound. You know the true meaning of ‘effortless’.", "traits": ["It takes you 30 minutes to look like you didn't try", "You dig up brands your own way, not off the charts", "You think shoes look best slightly worn in", "You don't buy big-logo pieces", "Ask “where's that from?” and you name a brand only insiders know", "Oversized, yet never once sloppy", "You hear ‘you have a vibe’ more than ‘you dress well’"], "brands": [["Our Legacy", "Effortless European street mood"], ["Acne Studios", "The intersection of minimal and street"], ["POTTERY", "The density of neat daily wear"]], "tip": "Keep the silhouette roomy and the color low — let one detail make the difference."}, "MTRV": {"name": "City Pop", "tag": "The bright color of the city", "desc": "You brighten the street by adding light color and wit to simple clothes. An easy kind of cool that lifts the mood of everyone watching.", "traits": ["Your mood shows right in the day's color", "You count socks as part of the outfit", "Your clothes break the ice (“love that sweatshirt!”)", "The gloomier the day, the brighter you dress", "You're weak for character and graphic pieces", "Friends say “it looks good because you wear it”", "Shopping is your stress relief"], "brands": [["Mardi Mercredi", "Playful graphics and a daily mood"], ["Marithé François Girbaud", "Casual that bridges retro and now"], ["Covernat", "Easy-going city casual"]], "tip": "A color sweatshirt over neutral pants — you shine even dressed down."}, "XCFN": {"name": "Heritage Collector", "tag": "One who knows the depth of classic", "desc": "You richly enjoy pieces layered with time — check, tweed, trench. You're skilled at layering, and every piece has a story. You know the value of the old.", "traits": ["You have a philosophy for tying a trench belt", "You believe one scarf changes a look (and it does)", "You think of a good coat as an heirloom", "Seasonal closet swaps are a ritual", "You can name the brand just from the check pattern", "Your eyes move fastest at a vintage market", "You remember why you bought each piece, and its story"], "brands": [["Burberry", "British classic that is heritage itself"], ["Max Mara", "Material and silhouette that outlast time"], ["Brooks Brothers", "The prototype of American traditional"]], "tip": "Layering trench, knit and scarf — the more layers you stack, the more it becomes your language."}, "XCFV": {"name": "Old Money Glam", "tag": "Even opulence, with grace", "desc": "You love vivid color and ornament, but your grammar is strictly classic. You carry elegance and presence at once, holding the density of a lead wherever you go.", "traits": ["You'd rather luxury be recognized by silhouette and material than logo", "Gold accessories — never too much, but always present", "You shine most in formal settings", "You count fragrance as part of the outfit", "You're always the best-dressed in the group photo", "You buy early in the season rather than on sale", "You enjoy the question “where do you find such things?”"], "brands": [["Gucci", "Synonymous with classic and opulence"], ["Miu Miu", "Bold ornament within elegance"], ["Dolce&Gabbana", "The essence of Italian glam"]], "tip": "Gold accessories and rich materials — set the standard of opulence by quality."}, "XCRN": {"name": "Bohemian Dreamer", "tag": "A natural romantic", "desc": "Flowing silhouettes, natural materials, earth-tone color. You wear mood over formality. Your style carries the air of travel and the seasons.", "traits": ["You touch the texture first when choosing clothes", "Your wallet opens in front of linen", "Clothes bought on trips fill half your closet", "You know which pieces look best in natural light", "Your accessories lean silver and raw stone", "Your styling changes with hair down versus tied up", "People say you look comfortable, yet somehow romantic"], "brands": [["Isabel Marant", "The benchmark of Parisian bohemian"], ["Chloé", "Soft, free femininity"], ["Free People", "A naturally layered mood"]], "tip": "Linen, suede, knit — the more you layer textures, the deeper the romance."}, "XCRV": {"name": "Retro Lover", "tag": "A collector of vintage feeling", "desc": "You find treasure in the colors and patterns of the past. You freely mix check, floral and vivid primaries, completing a style that never overlaps with anyone else's.", "traits": ["Three hours at a thrift shop is standard", "“They don't make this anymore” is your catchphrase", "You've found treasure in your mom's closet", "You have era-specific taste even in florals and checks", "Your film-camera mood matches your taste in clothes", "You wear even new clothes with a vintage feel", "Your clothes almost never clash with anyone else's"], "brands": [["Marimekko", "Nordic classic of bold patterns"], ["Benetton", "The originator of color blocking"], ["COMME des GARÇONS PLAY", "An icon that adds wit to the classic"]], "tip": "One piece found at a vintage shop becomes the signature of your look."}, "XTFN": {"name": "Avant-Garde", "tag": "One who experiments with form", "desc": "On a base of black you experiment with silhouette itself. You enjoy asymmetry, draping and deconstructive details, speaking your attitude through clothes. For you, fashion is philosophy.", "traits": ["Your closet is an ode to black, but you insist each is a different black", "Asymmetric designs sway your heart", "You take “how do you even wear that?” as a compliment", "You think a silhouette is a message", "You hear that dressing plainly actually looks odd on you", "You know the designer's philosophy before buying", "Sorting black laundry is the hardest task in the world"], "brands": [["Rick Owens", "The king of dark avant-garde"], ["Yohji Yamamoto", "The poet of black and draping"], ["Ann Demeulemeester", "Poetic deconstruction"]], "tip": "Speak with silhouette and shape instead of color — black is an infinite canvas."}, "XTFV": {"name": "Maximal Icon", "tag": "Presence is the style", "desc": "You take on bold color, strong silhouettes and the newest trends without fear. There's no line between runway and street for you — your entrance alone changes a room.", "traits": ["If you wonder ‘is this too much?’ you're already wearing it out", "The day you stand longest at the mirror is the day you're most excited", "Others' stares feel welcome, not burdensome", "You lead trends rather than follow", "Your accessory drawer is as big as your closet", "Wear all-neutral and people ask if you're sick", "A dress-code party is the most welcome invitation"], "brands": [["Balenciaga", "The brand that shapes an era's silhouette"], ["Versace", "Synonymous with opulence"], ["Blumarine", "The revival of Y2K glam"]], "tip": "When it feels ‘too much,’ add one more — that extra touch makes you an icon."}, "XTRN": {"name": "Street Archiver", "tag": "Between utility and street", "desc": "You know the archives of workwear, military and street inside out. You know the clothes that look better worn in, and you wear the brand's history and context too.", "traits": ["You can't throw away shoeboxes", "You remember the tag and release year of pieces", "You can tell the subtle difference in vintage washes", "You actually use every cargo-pants pocket", "You know brand histories by heart", "You prefer broken-in clothes to new ones", "You're your friends' human search engine for clothing info"], "brands": [["Carhartt WIP", "The standard of workwear street"], ["Stüssy", "The source of street culture"], ["thisisneverthat", "The archive of Korean street"]], "tip": "Cargo pants and a vintage wash — texture made by time is your point."}, "XTRV": {"name": "Hype Setter", "tag": "The first to wear it", "desc": "You try the new, the talked-about and the fun the fastest. You're fearless with color, graphics and mix-and-match, and you become your circle's style radar.", "trai let LANG = 'ko';
let QUESTIONS = I18N.ko.questions;
let AXES = I18N.ko.axes;
let TYPES = I18N.ko.types;
const TOAST = {
  ko:{saved:'결과 이미지가 저장되었습니다', fail:'이미지 생성에 실패했습니다'},
  en:{saved:'Result image saved', fail:'Could not create image'},
  ja:{saved:'結果画像を保存しました', fail:'画像の生成に失敗しました'},
  zh:{saved:'结果图片已保存', fail:'图片生成失败'}
};

/* ================= LOGIC ================= */
let current = 0;
let answers = []; // {s:'M', w:1} per question

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.remove('active'); void el.offsetWidth;
  el.classList.add('active');
  window.scrollTo({top:0});
}

function setLang(l){
  LANG = l;
  QUESTIONS = I18N[l].questions;
  AXES = I18N[l].axes;
  TYPES = I18N[l].types;
  applyUI();
  document.querySelector('header').classList.remove('hidden');
  show('intro');
}
function applyUI(){
  const u = I18N[LANG].ui;
  document.getElementById('introKicker').textContent = u.kicker;
  document.getElementById('introTitle').innerHTML = u.title.replace(/\n/g,'<br>');
  document.getElementById('introDesc').innerHTML = u.desc;
  document.getElementById('startBtn').textContent = u.start;
  document.getElementById('backBtn').textContent = u.back;
  document.getElementById('secAboutT').textContent = u.aboutT;
  document.getElementById('secAboutS').textContent = u.aboutS;
  document.getElementById('secBrandT').textContent = u.brandT;
  document.getElementById('secBrandS').textContent = u.brandS;
  document.getElementById('secNoteT').textContent = u.noteT;
  document.getElementById('shareBtn').textContent = u.share;
  document.getElementById('retakeBtn').textContent = u.retake;
  document.querySelectorAll('.enlab').forEach(e=>e.style.display = LANG==='en'?'none':'');
}

function startQuiz(){
  current = 0; answers = [];
  renderQuestion();
  show('quiz');
}

function renderQuestion(){
  const q = QUESTIONS[current];
  document.getElementById('qcur').textContent = String(current+1).padStart(2,'0');
  document.getElementById('qtext').textContent = q.q;
  document.getElementById('pbar').style.width = (current/QUESTIONS.length*100)+'%';
  document.getElementById('backBtn').style.visibility = current===0 ? 'hidden':'visible';
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  const marks = ['A','B','C','D'];
  q.opts.forEach((o,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="mark">'+marks[i]+'</span><span>'+o.t+'</span>';
    btn.onclick = ()=>answer(o);
    opts.appendChild(btn);
  });
  const quiz = document.getElementById('quiz');
  quiz.classList.remove('active'); void quiz.offsetWidth; quiz.classList.add('active');
}

function answer(o){
  answers[current] = {s:o.s, w:o.w};
  if(current < QUESTIONS.length-1){ current++; renderQuestion(); }
  else { showResult(); }
}

function goBack(){
  if(current>0){ current--; renderQuestion(); }
}

function computeResult(){
  const score = {};
  answers.forEach(a=>score[a.s]=(score[a.s]||0)+a.w);
  let code = '';
  const pct = [];
  AXES.forEach(ax=>{
    const l = score[ax.left]||0, r = score[ax.right]||0;
    const winner = l>=r ? ax.left : ax.right;
    code += winner;
    pct.push({ax, l, r, total:l+r});
  });
  return {code, pct};
}

function showResult(){
  const {code, pct} = computeResult();
  const t = TYPES[code];
  document.getElementById('rcode').textContent = code;
  document.getElementById('rname').textContent = t.name;
  document.getElementById('rtag').textContent = '“'+t.tag+'”';
  document.getElementById('rdesc').textContent = t.desc;
  document.getElementById('rimg').src = 'sketches/'+code+'.png';

  const axesEl = document.getElementById('raxes');
  axesEl.innerHTML = '';
  pct.forEach(p=>{
    const lp = Math.round(p.l/p.total*100);
    const rp = 100-lp;
    const leftWin = p.l>=p.r;
    const div = document.createElement('div');
    div.className='axis';
    div.innerHTML =
      '<div class="labels">'+
        '<span class="'+(leftWin?'on':'')+'">'+p.ax.left+' '+p.ax.leftLabel+' '+lp+'%</span>'+
        '<span class="'+(!leftWin?'on':'')+'">'+rp+'% '+p.ax.rightLabel+' '+p.ax.right+'</span>'+
      '</div>'+
      '<div class="track"><div class="fill" style="'+(leftWin?('left:0;width:'+lp+'%'):('right:0;width:'+rp+'%'))+'"></div></div>';
    axesEl.appendChild(div);
  });

  const trEl = document.getElementById('rtraits');
  trEl.innerHTML = '';
  t.traits.forEach(tr=>{
    const div = document.createElement('div');
    div.className='trait';
    div.innerHTML = '<span class="check">✓</span><span>'+tr+'</span>';
    trEl.appendChild(div);
  });

  const bEl = document.getElementById('rbrands');
  bEl.innerHTML = '';
  t.brands.forEach((b,i)=>{
    const div = document.createElement('div');
    div.className='brand';
    div.innerHTML = '<span class="no">'+String(i+1).padStart(2,'0')+'</span>'+
      '<div><div class="bname">'+b[0]+'</div><div class="breason">'+b[1]+'</div></div>';
    bEl.appendChild(div);
  });

  document.getElementById('rtip').innerHTML = '<b>STYLING NOTE</b>'+t.tip;
  document.getElementById('pbar').style.width = '100%';
  show('result');
}

function restart(){
  current=0; answers=[];
  document.querySelector('header').classList.add('hidden');
  show('lang');
}

/* ---------- share as image card ---------- */
function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),2200);
}

function wrapText(ctx, text, x, y, maxW, lh){
  const words = text.split(' ');
  let line = '';
  for(const w of words){
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxW && line){
      ctx.fillText(line, x, y); y += lh; line = w;
    } else line = test;
  }
  if(line){ ctx.fillText(line, x, y); y += lh; }
  return y;
}

async function buildShareCard(code, t){
  const W = 1080, PAD = 84, CW = W - PAD*2;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = 2400;
  const ctx = cv.getContext('2d');
  const F = (w,s)=>w+' '+s+'px Inter,"Pretendard Variable",Pretendard,-apple-system,sans-serif';
  try{ await document.fonts.ready; }catch(e){}

  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,2400);
  ctx.textBaseline = 'top';
  let y = PAD;

  /* logo */
  try{
    const svgEl = document.querySelector('header .logo svg');
    let s = new XMLSerializer().serializeToString(svgEl).replace(/currentColor/g,'#000000');
    const img = new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej;
      img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s); });
    const lw = 210, lh = lw*62/160;
    ctx.drawImage(img, PAD, y, lw, lh);
    y += lh + 60;
  }catch(e){ y += 10; }

  /* type identity: text left, sketch right */
  let skImg=null;
  try{
    skImg = new Image();
    await new Promise((res,rej)=>{ skImg.onload=res; skImg.onerror=rej; skImg.src='sketches/'+code+'.png'; });
  }catch(e){ skImg=null; }
  const headTop = y;
  /* kicker */
  try{ ctx.letterSpacing = '6px'; }catch(e){}
  ctx.fillStyle = '#86868b'; ctx.font = F(600,22);
  ctx.fillText('YOUR FASHION TYPE', PAD, y);
  try{ ctx.letterSpacing = '0px'; }catch(e){}
  y += 22 + 30;
  /* code / name / tag */
  ctx.fillStyle = '#000'; ctx.font = F(800,112);
  ctx.fillText(code, PAD-6, y); y += 112 + 22;
  ctx.font = F(700,52);
  ctx.fillText(t.name, PAD, y); y += 52 + 14;
  ctx.fillStyle = '#86868b'; ctx.font = F(400,30);
  ctx.fillText('“'+t.tag+'”', PAD, y); y += 30;
  /* sketch on the right, top-aligned with the text block */
  if(skImg){
    const sh = 380; const sw = skImg.width*(sh/skImg.height);
    ctx.drawImage(skImg, W-PAD-sw, headTop, sw, sh);
    y = Math.max(y, headTop + sh);
  }
  y += 40;

  /* divider */
  ctx.strokeStyle = '#d2d2d7'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke();
  y += 38;

  /* desc */
  ctx.fillStyle = '#3a3a3c'; ctx.font = F(400,30);
  y = wrapText(ctx, t.desc, PAD, y, CW, 48);
  y += 44;

  /* brands section */
  ctx.fillStyle = '#000'; ctx.font = F(700,38);
  ctx.fillText(I18N[LANG].ui.brandT, PAD, y);
  ctx.fillStyle = '#86868b'; ctx.font = F(600,20);
  ctx.fillText('BRAND MATCH', PAD + 210, y+14);
  y += 38 + 26;
  ctx.strokeStyle = '#e8e8ed';
  ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke();
  y += 26;
  t.brands.forEach((b,i)=>{
    ctx.fillStyle = '#86868b'; ctx.font = F(600,24);
    ctx.fillText('0'+(i+1), PAD, y+6);
    ctx.fillStyle = '#000'; ctx.font = F(700,32);
    ctx.fillText(b[0], PAD+64, y); y += 32 + 8;
    ctx.fillStyle = '#86868b'; ctx.font = F(400,26);
    y = wrapText(ctx, b[1], PAD+64, y, CW-64, 38);
    y += 20;
    ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke();
    y += 26;
  });
  y += 22;

  /* styling note box */
  ctx.font = F(400,28);
  const noteLines = [];
  (function(){ /* pre-measure */
    const words = t.tip.split(' '); let line='';
    for(const w of words){
      const test = line?line+' '+w:w;
      if(ctx.measureText(test).width > CW-72 && line){ noteLines.push(line); line=w; }
      else line = test;
    }
    if(line) noteLines.push(line);
  })();
  const boxH = 36 + 20 + 16 + noteLines.length*44 + 30;
  ctx.fillStyle = '#f5f5f7';
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(PAD, y, CW, boxH, 22); ctx.fill(); }
  else ctx.fillRect(PAD, y, CW, boxH);
  let by = y + 34;
  try{ ctx.letterSpacing = '4px'; }catch(e){}
  ctx.fillStyle = '#000'; ctx.font = F(700,20);
  ctx.fillText('STYLING NOTE', PAD+36, by);
  try{ ctx.letterSpacing = '0px'; }catch(e){}
  by += 20 + 18;
  ctx.fillStyle = '#3a3a3c'; ctx.font = F(400,28);
  noteLines.forEach(l=>{ ctx.fillText(l, PAD+36, by); by += 44; });
  y += boxH + 56;

  /* footer */
  try{ ctx.letterSpacing = '4px'; }catch(e){}
  ctx.fillStyle = '#86868b'; ctx.font = F(600,20);
  const ft = 'O.F.F. INTER-VIEW';
  ctx.fillText(ft, (W - ctx.measureText(ft).width)/2, y);
  try{ ctx.letterSpacing = '0px'; }catch(e){}
  y += 20 + PAD;

  /* compose onto 9:16 story canvas (1080x1920), content vertically centered */
  const out = document.createElement('canvas');
  out.width = W; out.height = 1920;
  const octx = out.getContext('2d');
  octx.fillStyle = '#ffffff';
  octx.fillRect(0, 0, W, 1920);
  if(y <= 1920){
    octx.drawImage(cv, 0, 0, W, y, 0, Math.round((1920 - y)/2), W, y);
  }else{
    const s = 1920/y;
    const sw = Math.round(W*s);
    octx.drawImage(cv, 0, 0, W, y, Math.round((W-sw)/2), 0, sw, 1920);
  }
  return out;
}

function shareResult(){
  const {code} = computeResult();
  const t = TYPES[code];
  buildShareCard(code, t).then(canvas=>{
    canvas.toBlob(blob=>{
      if(!blob){ showToast(TOAST[LANG].fail); return; }
      const file = new File([blob], 'OFF_InterView_'+code+'.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:'O.F.F. Inter-View'}).catch(()=>{});
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'OFF_InterView_'+code+'.png';
        document.body.appendChild(a); a.click(); a.remove();
        showToast(TOAST[LANG].saved);
      }
    }, 'image/png');
  });
}
